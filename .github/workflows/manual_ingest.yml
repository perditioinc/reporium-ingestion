name: Manual Ingestion Run

# Triggers the reporium-enrichment Cloud Run JOB (which runs
# `python -m ingestion run --mode <mode>`). Previously this workflow ran
# ingestion directly on the GitHub runner, but the prod DB is Cloud SQL reached
# via a unix socket (/cloudsql/perditio-platform:us-central1:reporium-db) that
# only exists inside Cloud Run — so the runner-based path failed every week with
# `psycopg2.OperationalError ... No such file or directory`. Executing the Cloud
# Run job instead runs the same code where the DB (and the github-token secret)
# are actually reachable. Same WIF + execute pattern as nightly_graph_build.yml.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (ignored if fix_repos is set)"
        type: choice
        options:
          - quick
          - weekly
          - full
        default: quick
      fix_repos:
        description: "Comma-separated repo names to re-ingest (leave blank for all)"
        required: false
        default: ""
  schedule:
    # Weekly cadence to keep commit stats / trend_snapshots fresh. Mondays 09:00 UTC.
    - cron: '0 9 * * 1'

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/573778300586/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: reporium-ingestion-ci@perditio-platform.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Execute reporium-enrichment Cloud Run Job
        id: ingest_job
        run: |
          MODE="${{ github.event.inputs.mode || 'quick' }}"
          FIX_REPOS="${{ github.event.inputs.fix_repos }}"
          if [ -n "$FIX_REPOS" ]; then
            # `fix` is its own CLI subcommand (main.py); pass --repos to it.
            ARGS="fix,--repos,$FIX_REPOS"
            echo "Executing reporium-enrichment in FIX mode for: $FIX_REPOS"
          else
            ARGS="-m,ingestion,run,--mode,$MODE"
            echo "Executing reporium-enrichment Cloud Run Job (mode=$MODE)..."
          fi
          gcloud run jobs execute reporium-enrichment \
            --project=perditio-platform \
            --region=us-central1 \
            --args="$ARGS" \
            --wait
          echo "Cloud Run Job completed successfully"

      - name: Surface Cloud Run Job diagnostics on failure
        if: failure() && steps.ingest_job.outcome == 'failure'
        run: |
          echo "::group::Recent reporium-enrichment executions"
          gcloud run jobs executions list \
            --job=reporium-enrichment \
            --project=perditio-platform \
            --region=us-central1 \
            --limit=3 \
            --format='table(metadata.name,status.startTime,status.completionTime,status.conditions[0].type,status.conditions[0].message)' || true
          echo "::endgroup::"

          LATEST=$(gcloud run jobs executions list \
            --job=reporium-enrichment \
            --project=perditio-platform \
            --region=us-central1 \
            --limit=1 \
            --format='value(metadata.name)' 2>/dev/null || true)
          if [ -n "$LATEST" ]; then
            echo "::group::Last 200 log lines for $LATEST"
            gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=reporium-enrichment AND labels.\"run.googleapis.com/execution_name\"=$LATEST" \
              --project=perditio-platform \
              --limit=200 \
              --format='value(timestamp,severity,textPayload)' \
              --order=asc || true
            echo "::endgroup::"
          fi
