# Cloud Run Job: reporium-enrichment  (the weekly "Manual Ingestion Run")
#
# IMPORTANT (Fix #6 -- deploy target reconciliation): the LIVE Cloud Run job is
# named `reporium-enrichment`, NOT `reporium-ingestion-nightly`. An earlier
# revision of this file used the latter name, so its timeoutSeconds / resumable
# env changes would have been applied to a NON-EXISTENT job (or created a second
# orphan job) and never reached production. This manifest is now aligned to the
# real job name + image so the changes actually land.
#
# This manifest mirrors the runtime config of `deploy/enrichment-job.yaml`
# (VPC egress, Cloud SQL socket, least-privilege SA) but overrides the container
# COMMAND to `python -m ingestion run --mode quick`, which is the entrypoint that
# uses the resumable/budgeted pipeline (ingestion/budget.py + ingestion/main.py).
#
# AN OPERATOR MUST APPLY THIS -- it does not deploy itself. Substitute the two
# placeholders and replace the live job in one shot:
#
#   PROJECT_ID=perditio-platform REGION=us-central1
#   sed -e "s/PROJECT_ID/$PROJECT_ID/g" -e "s/REGION/$REGION/g" deploy/job.yaml \
#     | gcloud run jobs replace - --region "$REGION"
#
# Verify the timeout + env actually landed on the live job:
#
#   gcloud run jobs describe reporium-enrichment --region "$REGION" \
#     --format='yaml(spec.template.spec.template.spec.timeoutSeconds,
#                    spec.template.spec.template.spec.containers[0].env)'
#
# NOTE: the CODE DEFAULTS are safe even if these env vars are never set --
# max_repos_per_run() defaults to 400, run_time_budget_seconds() to 2700, and
# freshness_slo_hours() to 48 (see ingestion/budget.py). The env block below
# only makes those values explicit/tunable in prod; omitting it does not break
# the resumable behaviour.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: reporium-enrichment
spec:
  template:
    metadata:
      annotations:
        # Attaches the Unix socket at /cloudsql/<connection> inside the container.
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:reporium-db
        # gen2 is required for VPC egress + Cloud SQL socket on Cloud Run Jobs.
        run.googleapis.com/execution-environment: gen2
        # Direct VPC egress to the default network where reporium-db lives.
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
        # Only route RFC1918 traffic through the VPC; public APIs (Anthropic,
        # GitHub) continue to use Cloud Run's default egress.
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      template:
        spec:
          maxRetries: 1
          # Defense-in-depth only. The PRIMARY fix for the weekly timeout is
          # resumable batching in ingestion/budget.py: each run processes only
          # MAX_REPOS_PER_RUN of the pending set (newest forks first) and stops
          # at RUN_TIME_BUDGET_SECONDS, so a single invocation finishes well
          # under this ceiling and the durable Postgres cache lets the next run
          # resume. The modest bump to 5400s (90 min) just widens the safety
          # margin; it is NOT the mechanism that keeps runs in budget.
          timeoutSeconds: 5400
          # Least-privilege runtime SA (see deploy/enrichment-job.yaml).
          serviceAccountName: reporium-enrichment@PROJECT_ID.iam.gserviceaccount.com
          containers:
            - image: us-central1-docker.pkg.dev/PROJECT_ID/cloud-run-source-deploy/reporium-enrichment:latest
              command:
                - python
                - -m
                - ingestion
                - run
                - --mode
                - quick
              resources:
                limits:
                  cpu: "1"
                  memory: 512Mi
              env:
                # DATABASE_URL is the durable Postgres cache + the live corpus.
                # It IS the resumable checkpoint store -- without it the run
                # cannot resume across invocations. normalize_db_url() converts
                # the +asyncpg URL to psycopg2 automatically.
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: reporium-db-url-async
                      key: latest
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: github-token
                      key: latest
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: github-token
                      key: latest
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: anthropic-api-key
                      key: latest
                - name: REPORIUM_API_URL
                  valueFrom:
                    secretKeyRef:
                      name: REPORIUM_API_URL
                      key: latest
                - name: REPORIUM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: REPORIUM_API_KEY
                      key: latest
                - name: INGEST_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: INGEST_API_KEY
                      key: latest
                # KAN-200: keep the README fallback summarizer's floor in
                # lock-step with the KAN-191 probe's PROBE_SUMMARY_MIN_CHARS.
                # Override here ONLY if you are also overriding the probe
                # config in reporium-api -- otherwise leave unset and both
                # sides will default to 50.
                - name: PROBE_SUMMARY_MIN_CHARS
                  value: "50"
                # Resumable-run budget (ingestion/budget.py). Each invocation
                # fully processes at most MAX_REPOS_PER_RUN of the pending set
                # (newest forks prioritised) and stops queuing new repos after
                # RUN_TIME_BUDGET_SECONDS, so the run finishes inside the task
                # timeout. The next scheduled (or re-triggered) run resumes from
                # the durable Postgres cache. Tune up once a run is observed to
                # comfortably finish a full pending batch in budget. Set
                # MAX_REPOS_PER_RUN=0 to disable the cap (legacy whole-corpus).
                - name: MAX_REPOS_PER_RUN
                  value: "400"
                - name: RUN_TIME_BUDGET_SECONDS
                  value: "2700"
                # Fraction of the per-run cap reserved for the OLDEST pending
                # repos so a steady stream of new forks can never starve old
                # deferred work (backlog drain fairness). 0 disables it.
                - name: RESERVE_OLDEST_FRACTION
                  value: "0.25"
                # Freshness SLO (hours): age of the newest GitHub repo not yet
                # in the DB beyond which the run logs a breach (observability
                # only; never fails the run).
                - name: FRESHNESS_SLO_HOURS
                  value: "48"
